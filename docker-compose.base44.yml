services:
  demo:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /app
    # Install the bind-mounted source in editable mode on every boot (fast: the
    # SDK's runtime dependencies are already baked into the image), then run the
    # demo console with live reload.
    command:
      - sh
      - -ec
      - pip install --no-cache-dir --no-build-isolation -e . && exec uvicorn demo.server:app --host 0.0.0.0 --port 3000 --reload --reload-dir /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - ANTIGRAVITY_HARNESS_PATH=/usr/local/bin/localharness
    env_file:
      - /run/base44/app.env
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:3000/',timeout=4).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: on-failure
    labels:
      base44.project: Google Antigravity SDK Demo
      base44.kind: web
      base44.port: 3000
